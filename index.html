<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ActiveClimate Melbourne - community sport and active travel groups turning everyday trips into measured emissions savings." />
    <title>ActiveClimate Melbourne</title>
    <style>
      /* Shown until Vue mounts. Account seeding runs PBKDF2 over three
         accounts on a first visit, which takes about a second, so the page
         says what is happening instead of sitting blank. */
      #boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: Avenir, Helvetica, Arial, sans-serif;
        background: #f9fbf9;
        color: #2c5f2d;
      }

      #boot .boot-mark {
        font-size: 2.5rem;
      }

      #boot .boot-text {
        font-size: 0.95rem;
        font-weight: 600;
      }

      #boot .boot-sub {
        font-size: 0.8rem;
        color: #6b7b6b;
      }

      #boot .boot-bar {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: #e3ebe3;
        overflow: hidden;
      }

      #boot .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #2c5f2d;
        animation: boot-slide 1.1s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      html[data-theme='dark'] #boot {
        background: #12150f;
        color: #45a049;
      }

      html[data-theme='dark'] #boot .boot-bar {
        background: #2d342a;
      }

      html[data-theme='dark'] #boot .boot-sub {
        color: #a2ad9e;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar span { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <span class="boot-mark" aria-hidden="true">🌍</span>
        <p class="boot-text">Loading ActiveClimate Melbourne</p>
        <div class="boot-bar" role="progressbar" aria-label="Loading"><span></span></div>
        <p class="boot-sub">Preparing your activity data</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
